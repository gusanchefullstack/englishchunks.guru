name: Hourly cron

# Manual trigger for the hourly job (reminders, invite expiry, practice-event pruning).
# The real hourly call comes from Google Cloud Scheduler (job cron-hourly, RUNBOOK §6): GitHub's
# schedule only ran every 6–9 hours. The route is idempotent (reminders are claimed once per
# learner per day), so running this by hand is harmless.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-hourly
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/hourly
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            https://englishchunks.guru/api/cron/hourly
