title = "englishchunks.guru secret scan"

[extend]
useDefault = true

[allowlist]
description = "Example env files hold placeholder names only"
paths = [
  '''(^|/)\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  '''uv\.lock$''',
]
# Literal placeholder used when billing is off (not a key): web/src/lib/providers/billing.ts
regexes = ['''rk_test_placeholder''']
